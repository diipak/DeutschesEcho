<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vocab Flashcard - Masculine Variant</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3b82f6", // Updated to a brighter blue for better glow
                        "primary-glow": "#60a5fa",
                        "slate-950": "#020617",
                        "slate-900": "#0f172a",
                        "slate-800": "#1e293b",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    boxShadow: {
                        'glow-blue': '0 0 20px -5px rgba(59, 130, 246, 0.5), 0 0 10px -2px rgba(59, 130, 246, 0.3)',
                        'glow-blue-strong': '0 0 30px -5px rgba(59, 130, 246, 0.4), inset 0 0 20px -10px rgba(59, 130, 246, 0.3)',
                    }
                },
            },
        }
    </script>
<style>.glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(59, 130, 246, 0.5);box-shadow: 0 0 15px rgba(59, 130, 246, 0.2), inset 0 0 20px rgba(255,255,255,0.02);
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-gradient-to-b from-slate-900 to-slate-950 font-display text-white h-screen overflow-hidden flex flex-col relative antialiased selection:bg-primary/30">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-blue-600/10 rounded-full blur-[120px] pointer-events-none mix-blend-screen"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-blue-800/10 rounded-full blur-[140px] pointer-events-none mix-blend-screen"></div>
<header class="flex flex-col w-full z-10 pt-12 px-6 pb-2"> 
<div class="flex items-center justify-between mb-6">
<button class="flex items-center justify-center size-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 transition-colors text-white/70 hover:text-white backdrop-blur-md">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<div class="flex flex-col gap-1 w-32">
<div class="flex justify-between items-center px-0.5">
<span class="text-[10px] font-semibold text-blue-200/50 tracking-wider uppercase">Progress</span>
<span class="text-[10px] font-bold text-white">5<span class="text-white/30 font-normal">/20</span></span>
</div>
<div class="h-1 w-full bg-slate-800/50 rounded-full overflow-hidden backdrop-blur-sm">
<div class="h-full bg-primary rounded-full shadow-[0_0_8px_rgba(59,130,246,0.8)]" style="width: 25%"></div>
</div>
</div>
<button class="flex items-center justify-center size-10 rounded-full bg-white/5 hover:bg-white/10 border border-white/5 transition-colors text-white/70 hover:text-white backdrop-blur-md">
<span class="material-symbols-outlined text-[20px]">more_horiz</span>
</button>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-start w-full px-6 pt-4 z-10 max-w-md mx-auto relative">
<button aria-label="Previous card" class="absolute left-2 top-[40%] -translate-y-1/2 p-3 text-white/20 hover:text-white hover:bg-white/5 rounded-full transition-all active:scale-95 z-20">
<span class="material-symbols-outlined text-4xl font-light">chevron_left</span>
</button>
<button aria-label="Next card" class="absolute right-2 top-[40%] -translate-y-1/2 p-3 text-white/20 hover:text-white hover:bg-white/5 rounded-full transition-all active:scale-95 z-20">
<span class="material-symbols-outlined text-4xl font-light">chevron_right</span>
</button>
<div class="relative w-full aspect-[4/5] max-h-[460px] flex flex-col group perspective-1000 mb-8">
<div class="glass-card relative w-full h-full rounded-3xl shadow-glow-blue-strong flex flex-col items-center justify-center p-8 overflow-hidden transition-transform duration-500">
<div class="absolute inset-0 bg-gradient-to-tr from-blue-500/5 via-transparent to-white/5 pointer-events-none"></div>
<div class="absolute top-6 right-6 z-20">
<span class="px-3 py-1.5 rounded-full bg-white/5 backdrop-blur-md text-blue-200 border border-white/10 text-[10px] font-bold tracking-widest uppercase shadow-sm">
                        Food
                    </span>
</div>
<div class="absolute top-6 left-6 text-primary/30 z-20">
<span class="material-symbols-outlined text-2xl">male</span>
</div>
<div class="flex flex-col items-center text-center gap-8 z-10 mt-2 w-full">
<div class="flex items-center justify-center gap-4 w-full">
<div class="flex flex-col items-end">
<h1 class="text-5xl font-bold tracking-tight text-white drop-shadow-xl flex items-baseline gap-3">
<span class="text-blue-400/80 font-normal text-2xl tracking-normal">der</span>Apfel
                            </h1>
<span class="text-slate-500 text-xs font-mono tracking-widest mt-1 opacity-60">[ ˈapfl̩ ]</span>
</div>
<button class="flex items-center justify-center size-12 rounded-full bg-primary/20 text-blue-100 border border-primary/40 hover:bg-primary/40 hover:scale-105 active:scale-95 transition-all backdrop-blur-sm group-hover:shadow-[0_0_15px_rgba(59,130,246,0.4)]">
<span class="material-symbols-outlined text-2xl fill-1">volume_up</span>
</button>
</div>
<div class="w-12 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<div>
<p class="text-xl text-slate-400 font-medium tracking-wide">the apple</p>
</div>
</div>
<div class="absolute bottom-0 left-0 right-0 h-24 bg-gradient-to-t from-primary/10 to-transparent pointer-events-none"></div>
</div>
</div>
<div class="w-full mt-auto mb-8">
<div class="glass-panel rounded-2xl p-6 w-full flex flex-col items-center text-center gap-3 transition-all hover:bg-white/5 relative overflow-hidden group">
<div class="absolute top-0 left-0 w-full h-[1px] bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
<div class="flex items-center gap-2 mb-1 text-primary/70">
<span class="material-symbols-outlined text-base">lightbulb</span>
<span class="text-[10px] uppercase tracking-widest font-bold">Context</span>
</div>
<p class="text-xl text-white/90 font-medium leading-relaxed tracking-wide">
<span class="text-blue-300">Der Apfel</span> ist rot.
                </p>
<p class="text-sm text-slate-500 font-normal">The apple is red.</p>
</div>
</div>
</main>
<div class="h-6 w-full"></div>

</body></html>
