<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>DeutschesEcho - Ultimate A1</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-dark": "#101622",
                        "slate-card": "#1e293b",
                        "accent-purple": "#7c3aed",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"],
                        "sans": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome & Material Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/animations.css">

</head>

<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden flex flex-col">

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 bg-black/90 z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
            <h2 class="text-xl font-bold text-white mb-4"><i class="fas fa-robot text-purple-400 mr-2"></i>Settings</h2>
            <p class="text-slate-400 text-sm mb-4">API key is configured on the server (.env file)</p>
            <button onclick="toggleSettings()"
                class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-2 rounded-lg transition">Close</button>
        </div>
    </div>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 relative overflow-y-auto pb-24 scroll-smooth">

        <!-- Dashboard Tab -->
        <div id="tab-home" class="tab-content active flex-col p-6 max-w-xl mx-auto w-full font-display">

            <!-- Header -->
            <header class="pt-6 pb-8 flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="toggleProfileMenu()">
                    <div class="relative">
                        <div id="profile-avatar"
                            class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white font-bold text-xl ring-2 ring-primary/20 shadow-lg shadow-primary/20 transition-transform hover:scale-105">
                            M
                        </div>
                        <div
                            class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-background-dark">
                        </div>
                    </div>
                    <div>
                        <div id="profile-name" class="text-lg font-semibold leading-none text-white">Me</div>
                        <span id="profile-level"
                            class="inline-flex items-center px-2 py-0.5 mt-1 rounded-full text-[10px] font-bold bg-primary/20 text-primary tracking-wider border border-primary/20">LEVEL
                            1</span>
                    </div>
                </div>
                <button onclick="toggleSettings()"
                    class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800/50 text-slate-400 hover:text-white transition-all hover:bg-slate-700/50 backdrop-blur-sm border border-white/5">
                    <span class="material-icons-round">settings</span>
                </button>
            </header>

            <!-- Profile Menu (Hidden) -->
            <div id="profile-menu"
                class="hidden absolute top-24 left-6 z-50 bg-slate-800/95 backdrop-blur-xl border border-white/10 shadow-2xl rounded-2xl p-4 w-64 transform origin-top-left transition-all duration-200">
                <h4 class="text-xs font-bold text-slate-500 uppercase mb-3 tracking-wider">Switch Profile</h4>
                <div id="profile-list" class="space-y-2 mb-3 max-h-48 overflow-y-auto"></div>
                <button onclick="createNewProfile()"
                    class="w-full py-2 px-3 bg-primary hover:bg-blue-600 rounded-xl text-white text-sm font-bold transition flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
                    <span class="material-icons-round text-sm">add</span> Add Profile
                </button>
            </div>

            <!-- Stats Cards -->
            <section class="grid grid-cols-2 gap-4 mb-8">
                <div
                    class="glass p-5 rounded-2xl flex flex-col gap-1 relative overflow-hidden group hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-2 text-orange-500 mb-2">
                        <span class="material-icons-round text-xl">local_fire_department</span>
                        <span class="text-xs font-bold uppercase tracking-wider opacity-70">Streak</span>
                    </div>
                    <div class="text-3xl font-bold text-white flex items-baseline gap-1" id="user-streak">
                        0 <span class="text-sm font-normal opacity-50">days</span>
                    </div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <span class="material-icons-round text-6xl text-orange-500">local_fire_department</span>
                    </div>
                </div>
                <div
                    class="glass p-5 rounded-2xl flex flex-col gap-1 relative overflow-hidden group hover:bg-white/5 transition-colors">
                    <div class="flex items-center gap-2 text-yellow-500 mb-2">
                        <span class="material-icons-round text-xl">bolt</span>
                        <span class="text-xs font-bold uppercase tracking-wider opacity-70">Total XP</span>
                    </div>
                    <div class="text-3xl font-bold text-white flex items-baseline gap-1" id="user-xp">
                        0 <span class="text-sm font-normal opacity-50">XP</span>
                    </div>
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity">
                        <span class="material-icons-round text-6xl text-yellow-500">bolt</span>
                    </div>
                </div>
            </section>

            <!-- Practice Grid -->
            <main class="mb-8">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4 px-1">Daily Practice</h2>
                <div class="grid grid-cols-2 gap-4">
                    <!-- Vocab -->
                    <button onclick="switchTab('vocab')"
                        class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-all hover:bg-white/5 group border-b-4 border-green-500/20 hover:border-green-500/50">
                        <div
                            class="w-14 h-14 rounded-full bg-green-500/10 flex items-center justify-center text-green-500 group-hover:scale-110 transition-transform duration-300 ring-1 ring-green-500/20">
                            <span class="material-icons-round text-3xl">menu_book</span>
                        </div>
                        <div>
                            <div class="font-semibold text-white">Vocab</div>
                            <div class="text-xs text-slate-400 mt-1">Foundations</div>
                        </div>
                    </button>
                    <!-- Grammar -->
                    <button onclick="switchTab('grammar')"
                        class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-all hover:bg-white/5 group border-b-4 border-primary/20 hover:border-primary/50">
                        <div
                            class="w-14 h-14 rounded-full bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300 ring-1 ring-primary/20">
                            <span class="material-icons-round text-3xl">widgets</span>
                        </div>
                        <div>
                            <div class="font-semibold text-white">Grammar</div>
                            <div class="text-xs text-slate-400 mt-1">Structure</div>
                        </div>
                    </button>
                    <!-- Reading -->
                    <button onclick="switchTab('reading')"
                        class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-all hover:bg-white/5 group border-b-4 border-orange-500/20 hover:border-orange-500/50">
                        <div
                            class="w-14 h-14 rounded-full bg-orange-500/10 flex items-center justify-center text-orange-500 group-hover:scale-110 transition-transform duration-300 ring-1 ring-orange-500/20">
                            <span class="material-icons-round text-3xl">auto_stories</span>
                        </div>
                        <div>
                            <div class="font-semibold text-white">Reading</div>
                            <div class="text-xs text-slate-400 mt-1">Comprehension</div>
                        </div>
                    </button>
                    <!-- Speaking -->
                    <button onclick="switchTab('speaking')"
                        class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-all hover:bg-white/5 group border-b-4 border-red-500/20 hover:border-red-500/50">
                        <div
                            class="w-14 h-14 rounded-full bg-red-500/10 flex items-center justify-center text-red-500 group-hover:scale-110 transition-transform duration-300 ring-1 ring-red-500/20">
                            <span class="material-icons-round text-3xl">mic</span>
                        </div>
                        <div>
                            <div class="font-semibold text-white">Speaking</div>
                            <div class="text-xs text-slate-400 mt-1">Pronunciation</div>
                        </div>
                    </button>
                </div>
            </main>

            <!-- Daily Wisdom Card -->
            <section class="mt-auto">
                <div
                    class="purple-gradient p-6 rounded-2xl relative overflow-hidden shadow-2xl shadow-accent-purple/20 group cursor-pointer transition-transform hover:scale-[1.02]">
                    <!-- Abstract Background Detail -->
                    <div
                        class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white/10 rounded-full blur-3xl group-hover:bg-white/20 transition-colors">
                    </div>
                    <div class="relative z-10">
                        <div class="flex items-center gap-2 mb-3">
                            <span class="material-icons-round text-white/80 text-sm">lightbulb</span>
                            <span class="text-xs font-bold text-white/70 uppercase tracking-widest">Daily Wisdom</span>
                        </div>
                        <p id="daily-wisdom" class="text-white text-lg font-medium leading-relaxed italic">
                            Learning German...
                        </p>
                    </div>
                </div>
            </section>
        </div>

        <!-- 2. VOCAB TAB -->
        <div id="tab-vocab" class="tab-content flex-col items-center justify-center h-full p-6">
            <div class="w-full max-w-md mb-4 flex justify-between items-center">
                <button onclick="switchTab('home')" class="text-slate-500 hover:text-white"><i
                        class="fas fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold text-white">Flashcards</h2>
                <div class="w-6"></div>
            </div>
            <div id="vocab-card-container" class="w-full max-w-sm h-96 relative perspective-1000"></div>
            <div class="flex gap-6 mt-8">
                <button onclick="handleSwipe(false)"
                    class="p-6 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition"><i
                        class="fas fa-times text-2xl"></i></button>
                <button onclick="playVocabAudio()"
                    class="p-6 rounded-full bg-slate-800 text-white shadow-lg transition transform active:scale-95"><i
                        class="fas fa-volume-up text-2xl"></i></button>
                <button onclick="handleSwipe(true)"
                    class="p-6 rounded-full bg-green-500/10 text-green-500 hover:bg-green-500 hover:text-white transition"><i
                        class="fas fa-check text-2xl"></i></button>
            </div>
        </div>

        <!-- Additional tabs will be loaded via JavaScript modules -->
        <div id="tab-grammar" class="tab-content flex-col items-center p-6 h-full">
            <div id="grammar-container" class="w-full h-full flex flex-col"></div>
        </div>
        <div id="tab-reading" class="tab-content flex-col p-6 h-full">
            <div id="reading-container" class="w-full h-full flex flex-col"></div>
        </div>
        <div id="tab-speaking" class="tab-content flex-col items-center p-6 h-full">
            <div id="speaking-container" class="w-full h-full flex flex-col"></div>
        </div>

    </main>

    <!-- NAVBAR -->
    <nav class="fixed bottom-0 left-0 w-full bg-slate-950/95 backdrop-blur-md border-t border-slate-800 px-2 py-2 z-50">
        <div class="flex justify-around items-center max-w-md mx-auto">
            <button onclick="switchTab('home')"
                class="nav-btn text-yellow-500 flex flex-col items-center p-2 rounded-lg hover:bg-white/5 transition w-16">
                <i class="fas fa-home text-lg mb-1"></i><span class="text-[9px] font-bold">Home</span>
            </button>
            <button onclick="switchTab('vocab')"
                class="nav-btn text-slate-500 flex flex-col items-center p-2 rounded-lg hover:bg-white/5 transition w-16">
                <i class="fas fa-layer-group text-lg mb-1"></i><span class="text-[9px] font-bold">Vocab</span>
            </button>
            <button onclick="switchTab('grammar')"
                class="nav-btn text-slate-500 flex flex-col items-center p-2 rounded-lg hover:bg-white/5 transition w-16">
                <i class="fas fa-dumbbell text-lg mb-1"></i><span class="text-[9px] font-bold">Practice</span>
            </button>
        </div>
    </nav>

    <!-- Main App Script -->
    <script type="module" src="/static/js/app.js?v=4"></script>
</body>

</html>
