<!DOCTYPE html>
<html class="dark" lang="de">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Practice - Speaking State</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Lora:wght@600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#22C55E", // Brilliant-inspired Green
                        "background-light": "#FFFFFF",
                        "background-dark": "#020617", // slate-950
                        accent: "#EF4444", // Red for recording
                    },
                    fontFamily: {
                        display: ["Lora", "serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "12px",
                    },
                },
            },
        };
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .audio-wave {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 40px;
        }

        .wave-bar {
            width: 3px;
            background: #EF4444;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {

            0%,
            100% {
                height: 8px;
            }

            50% {
                height: 32px;
            }
        }

        .wave-bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .wave-bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .wave-bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        .wave-bar:nth-child(5) {
            animation-delay: 0.4s;
        }

        .wave-bar:nth-child(6) {
            animation-delay: 0.3s;
        }

        .wave-bar:nth-child(7) {
            animation-delay: 0.2s;
        }

        .wave-bar:nth-child(8) {
            animation-delay: 0.1s;
        }

        .pulse-red {
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse-red 2s infinite;
        }

        @keyframes pulse-red {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(239, 68, 68, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-sans antialiased overflow-hidden">
    <div class="h-12 w-full"></div>
    <main class="max-w-md mx-auto h-[calc(100vh-48px)] flex flex-col px-6">
        <header class="flex items-center justify-between py-4">
            <button class="p-2 -ml-2 text-slate-400 hover:text-white">
                <span class="material-symbols-rounded">close</span>
            </button>
            <div class="flex-1 px-4">
                <div class="h-2 w-full bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
                    <div class="h-full bg-primary w-[65%] rounded-full"></div>
                </div>
            </div>
            <div class="flex items-center gap-1 font-bold text-amber-400">
                <span class="material-symbols-rounded text-xl">bolt</span>
                <span>12</span>
            </div>
        </header>
        <section class="flex-1 flex flex-col items-center justify-center text-center py-8">
            <span class="text-slate-400 uppercase tracking-widest text-xs font-bold mb-4">Speak this sentence</span>
            <h1 class="font-display text-3xl md:text-4xl font-bold leading-tight mb-4 text-slate-900 dark:text-white">
                „Ich hätte gerne eine <span class="text-amber-400 underline underline-offset-8">Überraschung</span>.“
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-lg mb-12">"I would like a surprise."</p>
            <div class="relative flex flex-col items-center">
                <div class="audio-wave mb-8">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <button
                    class="w-24 h-24 bg-accent rounded-full flex items-center justify-center pulse-red shadow-lg shadow-red-500/20 active:scale-95 transition-transform">
                    <span class="material-symbols-rounded text-white text-5xl">mic</span>
                </button>
                <span class="mt-6 text-accent font-semibold text-sm animate-pulse">RECORDING...</span>
            </div>
        </section>
        <div class="glass rounded-2xl p-6 mb-6 transform translate-y-0 transition-all duration-500">
            <div class="flex items-start gap-4">
                <div class="bg-amber-500/20 p-2 rounded-lg">
                    <span class="material-symbols-rounded text-amber-400">auto_awesome</span>
                </div>
                <div>
                    <h3 class="font-bold text-lg mb-1 text-slate-900 dark:text-white">The Umlaut Rule</h3>
                    <p class="text-slate-400 text-sm leading-relaxed mb-4">
                        Almost there! You pronounced the <span class="text-white font-mono">ü</span> as <span
                            class="text-white font-mono">u</span>.
                        To get the <span class="text-amber-400 font-bold">ü</span> sound, shape your mouth like you're
                        going to say "oo", but try to say "ee" instead.
                    </p>
                    <div class="flex gap-2">
                        <button
                            class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-white/20 transition-colors">
                            <span class="material-symbols-rounded text-sm">volume_up</span> Hear Difference
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <footer class="pb-8 pt-2">
            <button
                class="w-full bg-primary hover:bg-green-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-green-500/20 active:translate-y-0.5 transition-all text-lg">
                Check Answer
            </button>
        </footer>
    </main>
    <div
        class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px] pointer-events-none">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-10%] w-[50%] h-[50%] bg-accent/5 rounded-full blur-[120px] pointer-events-none">
    </div>

</body>

</html>
