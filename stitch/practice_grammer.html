<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Grammar Builder - DeutschesEcho</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <style type="text/tailwindcss">
        :root {
        --primary-orange: #FF8A3D;
        --slate-950: #020617;
      }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .drop-zone-border {
        border: 2px dashed rgba(99, 102, 241, 0.4);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
      }
      .logic-card-glow {
        background: rgba(30, 27, 75, 0.3);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(99, 102, 241, 0.3);
        box-shadow: 0 0 20px rgba(79, 70, 229, 0.1);
      }
      .heart-glow {
        filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.7));
      }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#FF8A3D",
                        slate: {
                            950: "#020617",
                        }
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-slate-950 font-display text-slate-100 min-h-screen flex flex-col items-center overflow-x-hidden">
    <div class="w-full max-w-md h-12 flex justify-between items-center px-8 pt-4">
        <span class="text-xs font-bold text-slate-400">9:41</span>
        <div class="flex gap-1">
            <span class="material-symbols-outlined text-[14px] text-slate-400">signal_cellular_alt</span>
            <span class="material-symbols-outlined text-[14px] text-slate-400">wifi</span>
            <span class="material-symbols-outlined text-[14px] text-slate-400">battery_full</span>
        </div>
    </div>
    <main class="w-full max-w-md flex-1 flex flex-col px-6 relative">
        <header class="flex items-center justify-between py-6 gap-4">
            <button
                class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-900/50 hover:bg-slate-800 transition-colors">
                <span class="material-symbols-outlined text-slate-400">close</span>
            </button>
            <div class="flex-1 h-2.5 bg-slate-900 rounded-full overflow-hidden">
                <div class="h-full bg-primary w-2/3 rounded-full shadow-[0_0_10px_rgba(255,138,61,0.4)]"></div>
            </div>
            <div class="flex items-center gap-1.5 ml-2">
                <span class="material-symbols-outlined text-red-500 fill-1 heart-glow"
                    style="font-variation-settings: 'FILL' 1">favorite</span>
                <span class="material-symbols-outlined text-red-500 fill-1 heart-glow"
                    style="font-variation-settings: 'FILL' 1">favorite</span>
                <span class="material-symbols-outlined text-slate-800"
                    style="font-variation-settings: 'FILL' 0">favorite</span>
            </div>
        </header>
        <section class="flex-1 flex flex-col pt-4">
            <div class="mb-8">
                <h1 class="text-2xl font-bold mb-2 text-white">Translate this sentence</h1>
                <p class="text-slate-400 text-lg font-medium italic">"I have a dog"</p>
            </div>
            <div
                class="min-h-[160px] w-full rounded-2xl drop-zone-border bg-slate-900/40 flex flex-wrap content-start p-4 gap-3 mb-10">
                <div
                    class="glass-card h-12 px-6 flex items-center justify-center rounded-xl text-lg font-semibold text-white shadow-xl">
                    Ich
                </div>
                <div
                    class="glass-card h-12 px-6 flex items-center justify-center rounded-xl text-lg font-semibold text-white shadow-xl">
                    habe
                </div>
            </div>
            <div class="flex flex-wrap justify-center gap-3">
                <button
                    class="bg-slate-900/40 border border-slate-800 px-6 py-3 rounded-xl text-lg font-semibold text-slate-600 cursor-not-allowed">
                    Ich
                </button>
                <button
                    class="bg-slate-900/40 border border-slate-800 px-6 py-3 rounded-xl text-lg font-semibold text-slate-600 cursor-not-allowed">
                    habe
                </button>
                <button
                    class="glass-card px-6 py-3 rounded-xl text-lg font-semibold text-white hover:bg-white/10 active:scale-95 transition-all border-indigo-500/20">
                    einen
                </button>
                <button
                    class="glass-card px-6 py-3 rounded-xl text-lg font-semibold text-white hover:bg-white/10 active:scale-95 transition-all">
                    Hund
                </button>
                <button
                    class="glass-card px-6 py-3 rounded-xl text-lg font-semibold text-white hover:bg-white/10 active:scale-95 transition-all">
                    Katze
                </button>
                <button
                    class="glass-card px-6 py-3 rounded-xl text-lg font-semibold text-white hover:bg-white/10 active:scale-95 transition-all">
                    ein
                </button>
            </div>
        </section>
        <div class="mb-6">
            <div class="logic-card-glow rounded-2xl p-5 flex gap-4">
                <div
                    class="w-10 h-10 shrink-0 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <span class="material-symbols-outlined text-white text-xl">auto_awesome</span>
                </div>
                <div>
                    <h3 class="font-bold text-indigo-200 mb-1">Accusative Case with Haben</h3>
                    <p class="text-sm text-indigo-100/70 leading-relaxed">
                        In German, 'haben' always takes the <strong class="text-indigo-200">accusative case</strong>.
                        For masculine nouns like 'Hund', the article 'ein' changes to 'einen'.
                    </p>
                </div>
            </div>
        </div>
        <footer class="pb-10 pt-2">
            <button
                class="w-full bg-primary hover:bg-orange-600 transition-all text-white font-extrabold text-lg py-5 rounded-2xl shadow-lg shadow-orange-500/40 active:scale-[0.98] flex items-center justify-center gap-2">
                CHECK ANSWER
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
            </button>
        </footer>
    </main>
    <div
        class="fixed top-[-10%] left-[-20%] w-[80%] h-[50%] bg-indigo-500/5 blur-[120px] rounded-full -z-10 pointer-events-none">
    </div>
    <div
        class="fixed bottom-[-10%] right-[-20%] w-[80%] h-[50%] bg-primary/5 blur-[120px] rounded-full -z-10 pointer-events-none">
    </div>

</body>

</html>
