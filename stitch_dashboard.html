<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Language Learning Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#135bec",
                        "background-light": "#f6f6f8",
                        "background-dark": "#101622",
                        "slate-card": "#1e293b",
                        "accent-purple": "#7c3aed",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .purple-gradient {
            background: linear-gradient(135deg, #7c3aed 0%, #135bec 100%);
        }
        body {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="max-w-md mx-auto min-h-screen flex flex-col pb-24">
<!-- Header -->
<header class="px-6 pt-12 pb-6 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="relative">
<div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white font-bold text-xl ring-2 ring-primary/20">
                        M
                    </div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 rounded-full border-2 border-background-dark"></div>
</div>
<div>
<h1 class="text-lg font-semibold leading-none">Me</h1>
<span class="inline-flex items-center px-2 py-0.5 mt-1 rounded-full text-[10px] font-bold bg-primary text-white tracking-wider">LEVEL 1</span>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-800/50 text-slate-400 hover:text-white transition-colors">
<span class="material-icons-round">settings</span>
</button>
</header>
<!-- Stats Cards -->
<section class="px-6 grid grid-cols-2 gap-4 mb-8">
<div class="glass p-4 rounded-xl flex flex-col gap-1">
<div class="flex items-center gap-2 text-orange-500">
<span class="material-icons-round text-xl">local_fire_department</span>
<span class="text-xs font-medium uppercase tracking-wider opacity-70">Streak</span>
</div>
<div class="text-2xl font-bold">0 <span class="text-sm font-normal opacity-50">days</span></div>
</div>
<div class="glass p-4 rounded-xl flex flex-col gap-1">
<div class="flex items-center gap-2 text-yellow-500">
<span class="material-icons-round text-xl">bolt</span>
<span class="text-xs font-medium uppercase tracking-wider opacity-70">Total XP</span>
</div>
<div class="text-2xl font-bold">0 <span class="text-sm font-normal opacity-50">XP</span></div>
</div>
</section>
<!-- Practice Grid -->
<main class="px-6 mb-8">
<h2 class="text-sm font-semibold uppercase tracking-widest opacity-40 mb-4 px-1">Daily Practice</h2>
<div class="grid grid-cols-2 gap-4">
<!-- Vocab -->
<button class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-green-500/20 flex items-center justify-center text-green-500">
<span class="material-icons-round text-3xl">menu_book</span>
</div>
<div>
<div class="font-semibold">Vocab</div>
<div class="text-xs opacity-50">12 words today</div>
</div>
</button>
<!-- Grammar -->
<button class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-icons-round text-3xl">widgets</span>
</div>
<div>
<div class="font-semibold">Grammar</div>
<div class="text-xs opacity-50">Sentence building</div>
</div>
</button>
<!-- Reading -->
<button class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-orange-500/20 flex items-center justify-center text-orange-500">
<span class="material-icons-round text-3xl">auto_stories</span>
</div>
<div>
<div class="font-semibold">Reading</div>
<div class="text-xs opacity-50">Short stories</div>
</div>
</button>
<!-- Speaking -->
<button class="glass p-6 rounded-2xl flex flex-col items-center text-center gap-4 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-full bg-red-500/20 flex items-center justify-center text-red-500">
<span class="material-icons-round text-3xl">mic</span>
</div>
<div>
<div class="font-semibold">Speaking</div>
<div class="text-xs opacity-50">Pronunciation</div>
</div>
</button>
</div>
</main>
<!-- Daily Wisdom Card -->
<section class="px-6 mt-auto">
<div class="purple-gradient p-6 rounded-2xl relative overflow-hidden shadow-2xl shadow-accent-purple/20">
<!-- Abstract Background Detail -->
<div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 bg-white/10 rounded-full blur-3xl"></div>
<div class="relative z-10">
<div class="flex items-center gap-2 mb-3">
<span class="material-icons-round text-white/80 text-sm">lightbulb</span>
<span class="text-xs font-bold text-white/70 uppercase tracking-widest">Daily Wisdom</span>
</div>
<h3 class="text-xl font-bold text-white mb-2 leading-tight">Learn German Today</h3>
<p class="text-white/80 text-sm font-light leading-relaxed">
                        "Die Übung macht den Meister" – Practice makes perfect. Keep your daily streak to master common conjugations.
                    </p>
<button class="mt-4 px-4 py-2 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-lg text-xs font-bold text-white transition-all">
                        VIEW TIP
                    </button>
</div>
</div>
</section>
<!-- Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto px-6 py-4">
<div class="glass rounded-full flex justify-around items-center p-2 px-6 shadow-2xl">
<button class="p-2 text-primary">
<span class="material-icons-round">home</span>
</button>
<button class="p-2 text-slate-500">
<span class="material-icons-round">leaderboard</span>
</button>
<button class="p-2 text-slate-500">
<span class="material-icons-round">chat_bubble</span>
</button>
<button class="p-2 text-slate-500">
<span class="material-icons-round">person</span>
</button>
</div>
</nav>
</div>
</body></html>
